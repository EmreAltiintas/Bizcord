# Local development — spins up RabbitMQ and UserService.Api for the Bizcord User Service.

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bizcord-rabbitmq
    ports:
      - "5672:5672"    # AMQP — EasyNetQ connects here
      - "15672:15672"  # Management UI — http://localhost:15672 (guest / guest)
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 30s
      timeout: 30s
      retries: 10

  user-service:
    image: bizcord/user-service
    build:
      context: ../..
      dockerfile: apps/user-profiles-microservice/Dockerfile
    container_name: bizcord-user-service
    ports:
      - "5084:8080"
    environment:
      ConnectionStrings__RabbitMq: "host=rabbitmq;username=guest;password=guest"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    networks:
      - default
      - bizcord
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Stand-ins for the Channel and Streaming services of other teams. Set the fail variables
  # to make the first N attempts per saga fail (0 never fails, 99 always fails), e.g.
  #   CHANNEL_FAIL_FIRST_ATTEMPTS=2 STREAMING_FAIL_FIRST_ATTEMPTS=0 docker compose up -d
  channel-stub:
    image: bizcord/saga-stubs
    build:
      context: ../..
      dockerfile: apps/user-profiles-microservice/src/SagaStubs.Worker/Dockerfile
    container_name: bizcord-channel-stub
    environment:
      ConnectionStrings__RabbitMq: "host=rabbitmq;username=guest;password=guest"
      Stub__Role: channel
      Stub__FailFirstAttempts: ${CHANNEL_FAIL_FIRST_ATTEMPTS:-0}
    depends_on:
      rabbitmq:
        condition: service_healthy

  streaming-stub:
    image: bizcord/saga-stubs
    build:
      context: ../..
      dockerfile: apps/user-profiles-microservice/src/SagaStubs.Worker/Dockerfile
    container_name: bizcord-streaming-stub
    environment:
      ConnectionStrings__RabbitMq: "host=rabbitmq;username=guest;password=guest"
      Stub__Role: streaming
      Stub__FailFirstAttempts: ${STREAMING_FAIL_FIRST_ATTEMPTS:-0}
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  bizcord:
    external: true
