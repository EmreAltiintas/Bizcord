# Local development — spins up RabbitMQ and UserService.Api for the Bizcord User Service.

# Services log to stdout; Docker stores that in json-file logs and the fluentd sidecar tails them.
x-logging: &json-file-logging
  driver: json-file

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bizcord-rabbitmq
    ports:
      - "5672:5672"    # AMQP — EasyNetQ connects here
      - "15672:15672"  # Management UI — http://localhost:15672 (guest / guest)
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 30s
      timeout: 30s
      retries: 10

  user-service:
    image: bizcord/user-service
    build:
      context: ../..
      dockerfile: apps/user-profiles-microservice/Dockerfile
    container_name: bizcord-user-service
    ports:
      - "5084:8080"
    environment:
      ConnectionStrings__RabbitMq: "host=rabbitmq;username=guest;password=guest"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    networks:
      - default
      - bizcord
    logging: *json-file-logging
    depends_on:
      fluentd:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Stand-ins for the Channel and Streaming services of other teams. Set the fail variables
  # to make the first N attempts per saga fail (0 never fails, 99 always fails), e.g.
  #   CHANNEL_FAIL_FIRST_ATTEMPTS=2 STREAMING_FAIL_FIRST_ATTEMPTS=0 docker compose up -d
  channel-stub:
    image: bizcord/saga-stubs
    build:
      context: ../..
      dockerfile: apps/user-profiles-microservice/src/SagaStubs.Worker/Dockerfile
    container_name: bizcord-channel-stub
    environment:
      ConnectionStrings__RabbitMq: "host=rabbitmq;username=guest;password=guest"
      Stub__Role: channel
      Stub__FailFirstAttempts: ${CHANNEL_FAIL_FIRST_ATTEMPTS:-0}
    logging: *json-file-logging
    depends_on:
      fluentd:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  streaming-stub:
    image: bizcord/saga-stubs
    build:
      context: ../..
      dockerfile: apps/user-profiles-microservice/src/SagaStubs.Worker/Dockerfile
    container_name: bizcord-streaming-stub
    environment:
      ConnectionStrings__RabbitMq: "host=rabbitmq;username=guest;password=guest"
      Stub__Role: streaming
      Stub__FailFirstAttempts: ${STREAMING_FAIL_FIRST_ATTEMPTS:-0}
    logging: *json-file-logging
    depends_on:
      fluentd:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Logging sidecar. Tails the json-file logs of all containers and prints them to its own
  # stdout (see fluentd/fluent.conf). View with: docker compose logs -f fluentd
  fluentd:
    image: fluent/fluentd:v1.17-1
    container_name: bizcord-fluentd
    user: root  # container log files are only readable by root
    environment:
      FLUENTD_CONF: fluent.conf
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - /var/lib/docker/containers:/fluentd/log/containers:ro
      - fluentd-pos:/fluentd/pos

volumes:
  fluentd-pos:

networks:
  bizcord:
    external: true
