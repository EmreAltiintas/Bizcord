# Sidecar log collector. Reads the json-file logs Docker writes for every container's
# stdout/stderr and forwards them to the "central system", which here is Fluentd's own stdout.

<source>
  @type tail
  path /fluentd/log/containers/*/*-json.log
  pos_file /fluentd/pos/docker-containers.pos
  read_from_head false
  tag docker.*
  <parse>
    @type json
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>

# Fluentd prints what it forwards to its own stdout, which Docker then logs and tail would
# read again. Drop those lines to avoid a feedback loop.
<filter docker.**>
  @type grep
  <exclude>
    key log
    pattern /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ [+-]\d{4} docker\./
  </exclude>
</filter>

<match docker.**>
  @type stdout
</match>
